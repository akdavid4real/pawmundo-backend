version: '3.8'

services:
  test-db:
    image: postgres:15-alpine
    container_name: pawpromise-test-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pawpromise_test
    ports:
      - "5433:5432" # Mapped to 5433 to avoid conflicts
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pawpromise_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
